name: Grok Video Studio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Compile Python modules
        shell: bash
        run: python -m compileall -q grok-video-studio/scripts
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  installer:
    name: PowerShell installer checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Parse installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { $_.Message }; exit 1 }
      - name: Run read-only installed-plan smoke test
        shell: pwsh
        run: |
          python .\grok-video-studio\scripts\grok_video_studio.py version
          python .\grok-video-studio\scripts\grok_video_studio.py install-plan --profile basic

  secrets:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject API-key-shaped literals
        shell: bash
        run: |
          if git grep -n -I -E 'sk-[A-Za-z0-9]{20,}' -- . ':!tests/fixtures'; then
            echo "A key-shaped literal was found in tracked files."
            exit 1
          fi
